<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.5">
<title>📊 持仓Dashboard</title>
<style>
:root{--bg:#0f172a;--fg:#e2e8f0;--cd:#1e293b;--bd:#334155;--sm:#64748b;--sb:#475569;--s2:#94a3b8;--s3:#cbd5e1;--s4:#38bdf8;--s6:#450a0a;--s7:#064e3b;--s8:#1e1b4b;--s9:#fbbf24;--s0:#0f172a;--border:#334155;--input:#0f172a;--label:#94a3b8;--danger:#ef4444;--success:#34d399;--warn:#f59e0b}
[data-theme=light]{--bg:#f1f5f9;--fg:#1e293b;--cd:#ffffff;--bd:#cbd5e1;--sm:#64748b;--s2:#475569;--s3:#475569;--s4:#0284c7;--s6:#fef2f2;--s7:#f0fdf4;--s8:#eef2ff;--s9:#f59e0b;--s0:#ffffff;--border:#cbd5e1;--input:#f1f5f9;--label:#64748b;--danger:#dc2626;--success:#16a34a;--warn:#d97706}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);padding:12px;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;padding-bottom:40px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
h1{font-size:18px}
.btn{background:var(--cd);border:1px solid var(--bd);color:var(--label);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .2s}
.btn:hover{background:var(--bd);color:var(--fg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:3px 8px;font-size:11px}
.btn-p{background:var(--s4);color:#fff;border-color:var(--s4)}
.btn-d{background:var(--danger);color:#fff;border-color:var(--danger)}
.cd{background:var(--cd);border-radius:10px;padding:14px;border:1px solid var(--bd);margin-bottom:10px}
.ct{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--s8);color:var(--s4)}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:8px}
.sc{background:var(--cd);border-radius:10px;padding:12px;border:1px solid var(--bd);position:relative;transition:all .2s}
.sc:hover{border-color:var(--s4)}
.l1{font-size:12px;color:var(--s4);margin-bottom:4px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pr{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.nv{font-size:22px;font-weight:700}
.ch{padding:2px 8px;border-radius:4px;font-size:13px;font-weight:600}
.up{background:var(--s6);color:var(--danger)}.dn{background:var(--s7);color:var(--success)}.fl{background:var(--cd);color:var(--label)}
.i1{font-size:11px;color:var(--label);padding:6px;background:var(--input);border-radius:6px;margin-top:4px;line-height:1.6;display:grid;grid-template-columns:1fr 1fr;gap:2px 6px}
.i1 .full{grid-column:1/3}
.del-btn{position:absolute;top:4px;right:6px;background:none;border:none;color:var(--danger);font-size:14px;cursor:pointer;opacity:.5}
.del-btn:hover{opacity:1}
.state-box{text-align:center;padding:20px;color:var(--label);font-size:13px}
.sp{display:inline-block;width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--s4);border-radius:50%;animation:s .8s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:20px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto}
.modal-box h2{font-size:16px;margin-bottom:10px}
.modal-box p{font-size:12px;color:var(--label);line-height:1.7;margin-bottom:10px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
input{background:var(--input);border:1px solid var(--border);color:var(--fg);padding:6px 10px;border-radius:6px;font-size:13px;font-family:inherit;width:100%}
input:focus{outline:none;border-color:var(--s4)}
label{font-size:11px;color:var(--label);display:block;margin-bottom:3px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.disclaimer-bar{position:fixed;bottom:0;left:0;right:0;background:var(--s6);color:var(--danger);font-size:10px;padding:4px 12px;text-align:center;z-index:999;border-top:1px solid var(--danger)}
.snap-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;flex-wrap:wrap;gap:4px}
.snap-item:last-child{border:none}
.ai-body{padding:8px;font-size:12px;line-height:1.7;background:var(--input);border-radius:6px;margin-top:6px;white-space:pre-wrap;max-height:480px;overflow-y:auto}
@media(max-width:600px){
  body{padding:8px}
  h1{font-size:16px}
  .form-row,.form-row.three{grid-template-columns:1fr}
  .sg{grid-template-columns:1fr}
  .nv{font-size:19px}
}
</style>
</head>
<body>

<div class="header">
  <h1>📊 我的持仓</h1>
  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
    <span id="clock2" style="font-size:11px;color:var(--label)"></span>
    <span class="btn btn-sm" onclick="toggleTheme()" id="themeBtn">☀️ 浅色</span>
    <span class="btn btn-sm" onclick="refreshAll()" id="refreshBtn">🔄 刷新</span>
  </div>
</div>

<!-- 免责弹窗 -->
<div id="disclaimerModal" class="modal-overlay">
  <div class="modal-box">
    <h2>⚠️ 风险免责声明</h2>
    <p>本页面数据仅供参考，不构成任何投资建议。股市有风险，入市需谨慎。</p>
    <p style="text-align:right"><button class="btn btn-p" onclick="acceptDisclaimer()">我已了解</button></p>
  </div>
</div>

<!-- 持仓 -->
<div class="cd" style="border-color:var(--s4)">
  <div class="ct">
    📋 <span id="pfCount">0只</span>
    <span style="font-size:12px;color:var(--label);font-weight:400" id="pfTotal"></span>
    <span id="pfDayPL"></span>
  </div>
  <div class="toolbar">
    <button class="btn btn-sm" onclick="toggleForm()">✏️ 编辑</button>
    <button class="btn btn-sm" onclick="exportCSV()">📤 导出</button>
    <button class="btn btn-sm" onclick="document.getElementById('csvFile').click()">📥 导入</button>
    <span style="font-size:10px;color:var(--label)" id="pfUpdateTime"></span>
    <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="importCSV(event)">
  </div>
  <div id="pfForm" style="display:none;margin-bottom:8px">
    <div class="form-row three">
      <div><label>代码</label><input id="pCode" placeholder="sh600000" onkeydown="if(event.key==='Enter')addStock()"></div>
      <div><label>成本价</label><input id="pCost" type="number" step="0.01" onkeydown="if(event.key==='Enter')addStock()"></div>
      <div><label>持仓股数</label><input id="pShares" type="number" step="1" onkeydown="if(event.key==='Enter')addStock()"></div>
    </div>
    <div class="form-row three">
      <div><label>买入逻辑</label><input id="pLogic" onkeydown="if(event.key==='Enter')addStock()"></div>
      <div><label>行业标签</label><input id="pTag" placeholder="存储/AI/黄金" onkeydown="if(event.key==='Enter')addStock()"></div>
      <div style="display:flex;align-items:flex-end;gap:4px">
        <button class="btn btn-p" onclick="addStock()">添加</button>
      </div>
    </div>
  </div>
  <div id="industryDist" style="font-size:11px;color:var(--label);margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap"></div>
  <div id="stockGrid" class="sg"></div>
</div>

<!-- 快照 -->
<div class="cd" style="border-color:#818cf8">
  <div class="ct">📸 分析快照 <span class="tag" id="snapCount">0条</span></div>
  <div id="snapList"></div>
</div>

<div class="disclaimer-bar">⚠️ 数据仅供参考，不构成投资建议 | 投资有风险，入市需谨慎</div>

<script>
'use strict';
/* ═══════════ State ═══════════ */
const PF_KEY='pd_portfolio';
const SNAP_KEY='pd_snapshots';
const DS_KEY='pd_disclaimer2';

const DEFAULT_PF=[
  {code:'sh688106',name:'金宏气体',cost:30.27,shares:0,logic:'半导体特气',tags:'特气'},
  {code:'sh688114',name:'华大智造',cost:68.15,shares:0,logic:'AI医疗',tags:'AI医疗'},
  {code:'sz002594',name:'比亚迪',cost:90.74,shares:0,logic:'新能源车',tags:'新能源'},
  {code:'sz000021',name:'深科技',cost:46.75,shares:0,logic:'存储封测',tags:'存储'},
  {code:'hk00981',name:'中芯国际(H)',cost:58.68,shares:0,logic:'芯片代工',tags:'芯片'},
  {code:'sh600399',name:'抚顺特钢',cost:6.63,shares:0,logic:'特钢',tags:'特钢'},
  {code:'sh601069',name:'华钰矿业',cost:69.83,shares:0,logic:'黄金锑矿',tags:'黄金'},
  {code:'sz300346',name:'南大光电',cost:53.22,shares:0,logic:'光刻胶MO源',tags:'光刻胶'},
  {code:'bj872808',name:'曙光数创',cost:83.18,shares:0,logic:'液冷',tags:'液冷'},
  {code:'sh600338',name:'西藏珠峰',cost:18.75,shares:0,logic:'铅锌锂矿',tags:'锂矿'},
];

let portfolio=loadPortfolio();
let snapshots=loadSnapshots();
let marketData={};

/* ═══════════ Init ═══════════ */
document.addEventListener('DOMContentLoaded',()=>{
  initClock();
  if(localStorage.getItem(DS_KEY)!=='ok'){
    document.getElementById('disclaimerModal').style.display='flex';
  }else{
    startApp();
  }
});

function acceptDisclaimer(){
  localStorage.setItem(DS_KEY,'ok');
  document.getElementById('disclaimerModal').style.display='none';
  startApp();
}

function startApp(){
  seedSnapshots();
  renderPortfolio();
  refreshAll();
}

/* ═══════════ Clock & Theme ═══════════ */
function initClock(){
  function tick(){document.getElementById('clock2').textContent=new Date().toLocaleString('zh-CN',{hour12:false});}
  tick();setInterval(tick,10000);
}
function toggleTheme(){
  const t=document.documentElement.getAttribute('data-theme')==='light';
  document.documentElement.setAttribute('data-theme',t?'dark':'light');
  document.getElementById('themeBtn').textContent=t?'🌙 暗色':'☀️ 浅色';
}

/* ═══════════ Portfolio ═══════════ */
function loadPortfolio(){
  try{const d=localStorage.getItem(PF_KEY);if(d)return JSON.parse(d);}catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_PF));
}
function savePortfolio(){
  localStorage.setItem(PF_KEY,JSON.stringify(portfolio));
  renderPortfolio();
}
function toggleForm(){
  const f=document.getElementById('pfForm');
  f.style.display=f.style.display==='none'?'block':'none';
}
function addStock(){
  const code=document.getElementById('pCode').value.trim().toLowerCase();
  if(!code){alert('请输入代码');return;}
  const cost=parseFloat(document.getElementById('pCost').value)||0;
  const shares=parseInt(document.getElementById('pShares').value)||0;
  const logic=document.getElementById('pLogic').value.trim();
  const tags=document.getElementById('pTag').value.trim();
  const idx=portfolio.findIndex(s=>s.code===code);
  if(idx>=0){portfolio[idx]={...portfolio[idx],cost,shares,logic,tags};}
  else{portfolio.push({code,cost,shares,logic,tags,name:code});}
  savePortfolio();
  ['pCode','pCost','pShares','pLogic','pTag'].forEach(id=>document.getElementById(id).value='');
  refreshStocks();
}
function delStock(code){
  portfolio=portfolio.filter(s=>s.code!==code);
  savePortfolio();
}

/* ═══════════ Render ═══════════ */
function renderPortfolio(){
  const grid=document.getElementById('stockGrid');
  document.getElementById('pfCount').textContent=portfolio.length+'只';
  if(!portfolio.length){
    grid.innerHTML='<div class="state-box">暂无持仓</div>';
    return;
  }
  let totalMv=0,totalDayPl=0,pos=0,neg=0;
  let html='';
  portfolio.forEach(s=>{
    const md=marketData[s.code]||{};
    const price=md.price||0;
    const chg=md.chg||0;
    const pe=md.pe||0;
    const chgCls=chg>0?'up':chg<0?'dn':'fl';
    const chgStr=chg!==0?(chg>0?'+':'')+chg.toFixed(2)+'%':'--';
    const pnlPct=(s.cost>0&&price>0)?(price-s.cost)/s.cost*100:0;
    const mv=price*s.shares;
    const dayPl=mv*(chg/100);
    const totPl=(price-s.cost)*s.shares;
    totalMv+=mv; totalDayPl+=dayPl;
    if(totPl>=0)pos++;else neg++;
    let peTag='';
    if(pe>100)peTag='<span class="tag" style="background:var(--s6);color:var(--danger)">⚠️PE'+Math.round(pe)+'极高</span>';
    else if(pe<0)peTag='<span class="tag" style="background:var(--s6);color:var(--warn)">⚠️亏损PE</span>';
    else if(pe>0)peTag='<span class="tag">PE'+Math.round(pe)+'</span>';
    const plCls=totPl>=0?'up':'dn';
    html+=`
      <div class="sc">
        <button class="del-btn" onclick="delStock('${s.code}')">✕</button>
        <div class="l1">
          <strong>${s.name||s.code}</strong>
          <span style="font-size:10px;color:var(--label)">${s.code.replace(/^(sh|sz|hk|bj)/,'')}</span>
          ${s.tags?'<span class="tag">'+s.tags+'</span>':''}
          ${peTag}
        </div>
        <div class="pr">
          <span class="nv">${price?price.toFixed(2):'--'}</span>
          <span class="ch ${chgCls}">${chgStr}</span>
        </div>
        <div class="i1">
          ${s.cost>0?'<span>成本 '+s.cost.toFixed(2)+'</span><span>盈亏 <b class="'+plCls+'">'+(pnlPct>=0?'+':'')+pnlPct.toFixed(1)+'%</b></span>':''}
          ${s.shares>0?'<span>'+s.shares+'股</span><span>'+(mv?'市值 '+Math.round(mv).toLocaleString():'')+'</span>':''}
          ${s.cost>0&&s.shares>0?'<span class="full">累计 <b class="'+plCls+'">'+(totPl>=0?'+':'')+Math.round(totPl).toLocaleString()+'</b> · 当日 <b class="'+chgCls+'">'+(dayPl>=0?'+':'')+Math.round(dayPl).toLocaleString()+'</b></span>':''}
          ${s.logic?'<span class="full" style="font-size:10px;color:var(--sm)">📝 '+s.logic+'</span>':''}
        </div>
      </div>`;
  });
  grid.innerHTML=html;
  document.getElementById('pfTotal').textContent='总市值 '+Math.round(totalMv).toLocaleString();
  document.getElementById('pfDayPL').innerHTML='<span class="tag '+(totalDayPl>=0?'up':'dn')+'">当日 '+(totalDayPl>=0?'+':'')+Math.round(totalDayPl).toLocaleString()+'</span>';
  document.getElementById('pfUpdateTime').textContent='更新 '+new Date().toLocaleTimeString('zh-CN',{hour12:false});
  renderIndustryDist();
}
function renderIndustryDist(){
  const tags={};
  portfolio.forEach(s=>{
    (s.tags||'').split('/').forEach(t=>{const tt=t.trim();if(tt)tags[tt]=(tags[tt]||0)+1;});
  });
  const e=Object.entries(tags).sort((a,b)=>b[1]-a[1]);
  document.getElementById('industryDist').innerHTML=e.length?e.map(([t,c])=>'<span class="tag">'+t+'×'+c+'</span>').join(''):'';
}

/* ═══════════ Market Data ═══════════ */
async function fetchMarket(code,timeout=12000){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),timeout);
  try{
    const resp=await fetch('https://qt.gtimg.cn/q='+code,{signal:ctrl.signal});
    const text=await resp.text();
    clearTimeout(timer);
    const p=text.split('~');
    if(p.length>32){
      return {code,name:p[1],price:parseFloat(p[3])||0,chg:parseFloat(p[32])||0,pe:parseFloat(p[39])||0,success:true};
    }
    return {code,success:false};
  }catch(e){
    clearTimeout(timer);
    return {code,success:false};
  }
}
async function refreshAll(){
  const btn=document.getElementById('refreshBtn');
  btn.disabled=true;btn.textContent='⏳ 更新中...';
  await refreshStocks();
  btn.textContent='🔄 刷新';btn.disabled=false;
}
async function refreshStocks(){
  if(!portfolio.length)return;
  const grid=document.getElementById('stockGrid');
  grid.innerHTML='<div class="state-box"><span class="sp"></span>加载行情中...</div>';
  const results=await Promise.all(portfolio.map(s=>fetchMarket(s.code)));
  results.forEach(r=>{if(r.success)marketData[r.code]=r;});
  renderPortfolio();
}

/* ═══════════ CSV ═══════════ */
function exportCSV(){
  if(!portfolio.length){alert('无数据');return;}
  const rows=portfolio.map(s=>[s.code,s.name||'',s.cost||0,s.shares||0,'"'+(s.logic||'')+'"','"'+(s.tags||'')+'"'].join(','));
  const csv='\uFEFF代码,名称,成本价,股数,买入逻辑,行业标签\n'+rows.join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='portfolio.csv';a.click();
}
function importCSV(ev){
  const file=ev.target.files[0];
  if(!file)return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const lines=e.target.result.split('\n').filter(l=>l.trim());
      for(let i=1;i<lines.length;i++){
        const c=lines[i].split(',').map(x=>x.trim().replace(/^"|"$/g,''));
        if(c.length<2||!c[0])continue;
        const entry={code:c[0],name:c[1]||c[0],cost:parseFloat(c[2])||0,shares:parseInt(c[3])||0,logic:c[4]||'',tags:c[5]||''};
        const idx=portfolio.findIndex(s=>s.code===entry.code);
        if(idx>=0)portfolio[idx]=entry;else portfolio.push(entry);
      }
      savePortfolio();
      refreshStocks();
    }catch(err){alert('解析失败: '+err.message);}
  };
  rd.readAsText(file);
  ev.target.value='';
}

/* ═══════════ Snapshots ═══════════ */
function loadSnapshots(){
  try{const d=localStorage.getItem(SNAP_KEY);if(d)return JSON.parse(d);}catch(e){}
  return [];
}
function saveSnapshots(){
  localStorage.setItem(SNAP_KEY,JSON.stringify(snapshots));
  document.getElementById('snapCount').textContent=snapshots.length+'条';
  renderSnapshots();
}
function seedSnapshots(){
  if(snapshots.length)return;
  snapshots=[
    {code:'sz300346',name:'南大光电',time:'2026-08-17T19:30:00Z',
     result:'①角色：国内半导体光刻胶+MO源双主业供应商，卡位半导体材料国产替代核心环节\n\n②通俗比喻：芯片制造的"墨水+颜料"供应商——光刻需要光刻胶（墨水），LED/显示需要MO源（颜料）\n\n③核心催化：光刻胶国产替代加速；晶圆厂扩产带动MO源需求【AI推演】\n\n④盈利概况：PE 121 ⚠️估值极高；毛利率35-45%【AI推演·未核验财报】\n\n⑤赛道拉动逻辑：利好-国产替代是战略；利空-验证周期长(1-3年)，估值透支\n\n⑥风险：PE 121估值极高；验证不及预期；LED周期波动；竞争加剧\n\n⑦置信：主营事实；推演-验证进度/竞争'},
    {code:'sh601069',name:'华钰矿业',time:'2026-08-17T19:31:00Z',

function renderSnapshots(){
  const el=document.getElementById('snapList');
  if(!snapshots.length){el.innerHTML='<div class="state-box">暂无快照</div>';return;}
  el.innerHTML=snapshots.map((s,i)=>
    '<div class="snap-item"><span><strong>'+s.name+'（'+s.code+'）</strong></span>'+
    '<span style="font-size:11px;color:var(--label)">'+new Date(s.time).toLocaleString('zh-CN',{hour12:false})+'</span>'+
    '<span><button class="btn btn-sm" onclick="viewSnap('+i+')">查看</button> '+
    '<button class="btn btn-sm" onclick="exportMD('+i+')">MD</button> '+
    '<button class="btn btn-sm btn-d" onclick="delSnap('+i+')">✕</button></span></div>'
  ).join('');
}
function viewSnap(i){
  const s=snapshots[i];
  if(!s)return;
  const el=document.createElement('div');
  el.className='modal-overlay';
  el.innerHTML='<div class="modal-box"><h2>'+s.name+'（'+s.code+'）7步分析</h2><div class="ai-body">'+s.result+'</div><p style="text-align:right;margin-top:8px"><button class="btn" onclick="this.closest(\'.modal-overlay\').remove()">关闭</button></p></div>';
  el.onclick=e=>{if(e.target===el)el.remove();};
  document.body.appendChild(el);
}
function exportMD(i){
  const s=snapshots[i];
  if(!s)return;
  const md='# '+s.name+'（'+s.code+'）\n\n> '+new Date(s.time).toLocaleString('zh-CN',{hour12:false})+'\n\n'+s.result;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+md],{type:'text/markdown;charset=utf-8'}));
  a.download=s.code+'_analysis.md';a.click();
}
function delSnap(i){
  if(!confirm('删除此快照？'))return;
  snapshots.splice(i,1);
  saveSnapshots();
}

/* ═══════════ Auto refresh (trading hours) ═══════════ */
setInterval(()=>{
  const n=new Date(),h=n.getHours(),m=n.getMinutes();
  if((h===9&&m>=30)||(h>=10&&h<15)){refreshStocks();}
},60000);
